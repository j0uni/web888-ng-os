# chronyd on the Web-888: the drift file on the configuration partition
# (a nofail mount: chronyd runs without it, on a fresh estimate).
# The directory is made outside the unit's sandbox ("+": chrony's unit
# has ProtectSystem=strict, under which /config is read-only), before
# ReadWritePaths opens it for chronyd.
[Unit]
WantsMountsFor=/config

[Service]
ExecStartPre=+-/bin/mkdir -p /config/chrony
ReadWritePaths=-/config/chrony
